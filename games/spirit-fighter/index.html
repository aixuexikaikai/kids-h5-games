<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>精灵格斗王 v3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
button{font:inherit}
#app{position:relative;width:100%;height:100%;max-width:920px;margin:auto;background:linear-gradient(#101a48,#070b23)}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.primary{border:0;border-radius:16px;padding:14px 28px;font-size:20px;font-weight:1000;color:#3c2300;background:linear-gradient(#ffe06b,#ffa20c);box-shadow:0 5px 0 #a96000}
.ghost{border:2px solid #62d7ff;background:#16295f;border-radius:14px;padding:12px 18px;color:#fff;font-weight:900}
#home{background:
radial-gradient(circle at 20% 18%,rgba(160,60,255,.32),transparent 30%),
radial-gradient(circle at 80% 22%,rgba(255,70,35,.27),transparent 35%),
linear-gradient(180deg,#142055,#0b1134 60%,#050816)}
.home-glow{position:absolute;left:10%;right:10%;top:8%;height:58%;border-radius:32px;background:linear-gradient(135deg,#1a286e,#402071 55%,#5f193f);border:2px solid rgba(103,214,255,.35);box-shadow:inset 0 0 70px rgba(95,98,255,.25)}
.home-glow:before,.home-glow:after{content:"";position:absolute;width:42%;aspect-ratio:1;border-radius:50%;bottom:8%;filter:blur(1px)}
.home-glow:before{left:4%;background:radial-gradient(circle,#ffd85a 0 8%,#ff6a2c 9% 20%,#a91b2b 21% 48%,transparent 49%)}
.home-glow:after{right:4%;background:radial-gradient(circle,#8aefff 0 7%,#435dff 8% 20%,#181f56 21% 48%,transparent 49%)}
.home-ui{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px}
.logo{font-size:clamp(40px,8vw,60px);font-style:italic;font-weight:1000;letter-spacing:-2px;text-shadow:0 4px 0 #2c1870,0 0 22px #8b61ff}
.logo small{display:block;text-align:center;font-size:11px;letter-spacing:8px;margin-top:2px}
.sub{font-size:13px;opacity:.75;font-weight:700}

#select{overflow:auto;background:linear-gradient(#132457,#0a1133);padding-bottom:100px}
.head{text-align:center;padding:18px 12px 8px}
.head h1{margin:0;font-size:30px;font-style:italic}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:12px}
.card{position:relative;aspect-ratio:.66;border-radius:17px;border:2px solid #4bcfff;overflow:hidden;background:#0f1942;transition:.15s}
.card img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.card span{position:absolute;left:0;right:0;bottom:0;padding:18px 3px 7px;text-align:center;font-weight:1000;font-size:11px;background:linear-gradient(transparent,#0c153f 48%)}
.card.sel{border-color:#ffc72e;transform:translateY(-7px);box-shadow:0 0 22px rgba(255,191,36,.55)}
.info{margin:10px 12px;padding:14px;border:1px solid rgba(103,218,255,.4);border-radius:18px;background:rgba(7,15,47,.75)}
.row{display:flex;justify-content:space-between;font-weight:900;margin:6px 0}
.meter{height:8px;border-radius:99px;background:#22315d;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#2fdca3,#7affca)}
.fixed-actions{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px max(12px,calc((100vw - 920px)/2 + 12px)) max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,8,23,.96) 40%)}
.fixed-actions button{flex:1}

#boss{background:radial-gradient(circle at 50% 30%,#57226b,#11183f 62%,#06091c)}
.boss-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.boss-frame{width:min(72vw,330px);height:min(56vh,430px);border-radius:24px;border:3px solid #ff4e90;overflow:hidden;background:#121942;box-shadow:0 0 34px rgba(255,54,132,.45);display:flex;align-items:center;justify-content:center}
.boss-frame img{width:100%;height:100%;object-fit:contain}
.boss-title{font-size:34px;font-style:italic;font-weight:1000}
.boss-name{font-size:26px;font-weight:1000;margin:14px 0 10px}

#battle{background:#070a20}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:grid;grid-template-columns:1fr 58px 1fr;gap:8px;pointer-events:none}
.hbox{padding:8px 9px;border:2px solid #5bd8ff;border-radius:13px;background:rgba(6,12,41,.85)}
.hbox.enemy{border-color:#ff5671}
.hname{display:flex;justify-content:space-between;font-size:12px;font-weight:1000}
.hp{height:9px;background:#2b2140;border-radius:99px;overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#20db93,#67ffb7)}
.enemy .hp i{background:linear-gradient(90deg,#ff3d5d,#ff8063)}
.en{height:5px;background:#1f2951;border-radius:99px;overflow:hidden;margin-top:5px}
.en i{display:block;height:100%;background:linear-gradient(90deg,#3da9ff,#8feaff)}
.clock{text-align:center;font-size:24px;font-weight:1000;text-shadow:0 2px 0 #10152d}
.controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 12px;pointer-events:none}
.move{display:flex;gap:10px;pointer-events:auto}
.move button,.acts button{width:66px;height:66px;border-radius:50%;border:3px solid rgba(255,255,255,.86);background:rgba(22,35,83,.8);font-size:28px;font-weight:1000;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.acts{display:flex;gap:10px;pointer-events:auto;align-items:end}
.acts .jump{background:radial-gradient(circle at 35% 25%,#91b7ff,#3158b9 60%,#17265d)}
.acts .atk{width:78px;height:78px;background:radial-gradient(circle at 35% 25%,#ff9e4a,#cf3527 60%,#650f16);font-size:32px}
.acts .special{background:radial-gradient(circle at 35% 25%,#ffd65a,#a84e12 60%,#542809);font-size:27px}
button:active{transform:scale(.93)}
.tip{display:none;position:absolute;inset:0;z-index:30;align-items:center;justify-content:center;text-align:center;background:#070b22;font-weight:900}
@media (orientation:portrait) and (max-width:760px){#battle .tip{display:flex}}
#result{background:radial-gradient(circle at 50% 25%,#263580,#0a0f31 60%,#050816)}
.result-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.result-card{width:min(90vw,480px);padding:28px 20px;border-radius:24px;border:2px solid #61d7ff;background:linear-gradient(#17296a,#0d143d);text-align:center}
.result-card.win{border-color:#ffc62d;box-shadow:0 0 40px rgba(255,193,39,.3)}
.rtitle{font-size:40px;font-weight:1000;font-style:italic}
.rbtns{display:flex;gap:10px;margin-top:20px}
.rbtns button{flex:1}
@media(max-width:520px){.roster{gap:5px}.card span{font-size:9px}.move button,.acts button{width:58px;height:58px}.acts .atk{width:70px;height:70px}}
</style>
</head>
<body>
<div id="app">
<section id="home" class="screen active">
 <div class="home-glow"></div>
 <div class="home-ui">
  <div class="logo">精灵格斗王<small>MONSTER FIGHT</small></div>
  <button class="primary" id="start">开始游戏</button>
  <div class="sub">选 1 个精灵，随机挑战 BOSS</div>
 </div>
</section>

<section id="select" class="screen">
 <div class="head"><h1>选择你的精灵</h1><div class="sub">角色贴图沿用最开始确定的视觉</div></div>
 <div class="roster" id="roster"></div>
 <div class="info">
  <div class="row"><span id="nm"></span><span id="tp"></span></div>
  <div class="row"><span>生命</span><span id="hpv"></span></div><div class="meter"><i id="hpm"></i></div>
  <div class="row"><span>攻击</span><span id="atkv"></span></div><div class="meter"><i id="atkm"></i></div>
  <div class="row"><span>速度</span><span id="spdv"></span></div><div class="meter"><i id="spdm"></i></div>
 </div>
 <div class="fixed-actions"><button class="ghost" id="back">返回</button><button class="primary" id="confirm">确认出战</button></div>
</section>

<section id="boss" class="screen">
 <div class="boss-wrap">
  <div class="boss-title">随机 BOSS 来袭！</div>
  <div class="sub">本场对手已确定</div>
  <div class="boss-frame"><img id="bossImg"></div>
  <div class="boss-name" id="bossName"></div>
  <button class="primary" id="fight">开始战斗</button>
 </div>
</section>

<section id="battle" class="screen">
 <canvas id="stage"></canvas>
 <div class="hud">
  <div class="hbox"><div class="hname"><span id="pn"></span><span id="php"></span></div><div class="hp"><i id="phpbar"></i></div><div class="en"><i id="pen"></i></div></div>
  <div class="clock" id="clock">60</div>
  <div class="hbox enemy"><div class="hname"><span id="en"></span><span id="ehp"></span></div><div class="hp"><i id="ehpbar"></i></div><div class="en"><i id="een"></i></div></div>
 </div>
 <div class="controls">
   <div class="move"><button type="button" id="left">◀</button><button type="button" id="right">▶</button></div>
   <div class="acts">
    <button type="button" class="jump" id="jump">↑</button>
    <button type="button" class="special" id="special">🔥</button>
    <button type="button" class="atk" id="attack">✊</button>
   </div>
 </div>
 <div class="tip">请横屏进行战斗</div>
</section>

<section id="result" class="screen">
 <div class="result-wrap"><div class="result-card" id="rcard">
  <div class="rtitle" id="rtitle"></div><div class="sub" id="rdesc"></div><div style="font-weight:1000;font-size:18px;margin-top:16px" id="reward"></div>
  <div class="rbtns"><button class="ghost" id="change">更换精灵</button><button class="primary" id="again">继续挑战</button></div>
 </div></div>
</section>
</div>

const $=id=>document.getElementById(id), screens=[...document.querySelectorAll('.screen')];
function show(id){screens.forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
let sel=0,bidx=0;
const roster=$('roster');
ROLES.forEach((r,i)=>{let d=document.createElement('div');d.className='card'+(i===0?' sel':'');d.innerHTML=`<img src="${r.img}"><span>${r.name}</span>`;d.onclick=()=>pick(i);roster.appendChild(d)});
function pick(i){sel=i;[...roster.children].forEach((x,j)=>x.classList.toggle('sel',j===i));let r=ROLES[i];$('nm').textContent=r.name;$('tp').textContent=r.icon;$('hpv').textContent=r.hp;$('atkv').textContent=r.atk;$('spdv').textContent=r.speed.toFixed(2);$('hpm').style.width=Math.min(100,r.hp/12)+'%';$('atkm').style.width=Math.min(100,r.atk/1.5)+'%';$('spdm').style.width=Math.min(100,r.speed*78)+'%'}
pick(0);
$('start').onclick=()=>show('select');$('back').onclick=()=>show('home');
$('confirm').onclick=()=>{bidx=Math.floor(Math.random()*BOSSES.length);$('bossImg').src=BOSSES[bidx].img;$('bossName').textContent=BOSSES[bidx].name;show('boss')};
$('fight').onclick=startGame;$('change').onclick=()=>show('select');$('again').onclick=()=>$('confirm').click();

const canvas=$('stage'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,ground=0,last=0,raf=0,g=null,keys={l:0,r:0};
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.73}
addEventListener('resize',resize);resize();
const imgs=ROLES.map(r=>{let i=new Image();i.src=r.img;return i}), bimgs=BOSSES.map(r=>{let i=new Image();i.src=r.img;return i});

function startGame(){show('battle');resize();let r=ROLES[sel],b=BOSSES[bidx];g={p:{x:W*.22,y:ground,vy:0,vx:0,hp:r.hp,max:r.hp,en:0,face:1,air:false,hit:0,flash:0},e:{x:W*.78,y:ground,vy:0,vx:0,hp:b.hp,max:b.hp,en:0,face:-1,air:false,hit:0,flash:0},time:60,over:false,parts:[],waves:[],ai:0,shake:0};$('pn').textContent=r.name;$('en').textContent=b.name;$('special').textContent=r.icon;last=performance.now();cancelAnimationFrame(raf);updateHud();raf=requestAnimationFrame(loop)}
function updateHud(){if(!g)return;$('php').textContent=Math.max(0,Math.ceil(g.p.hp))+'/'+g.p.max;$('ehp').textContent=Math.max(0,Math.ceil(g.e.hp))+'/'+g.e.max;$('phpbar').style.width=Math.max(0,g.p.hp/g.p.max*100)+'%';$('ehpbar').style.width=Math.max(0,g.e.hp/g.e.max*100)+'%';$('pen').style.width=Math.min(100,g.p.en)+'%';$('een').style.width=Math.min(100,g.e.en)+'%';$('clock').textContent=Math.max(0,Math.ceil(g.time))}
function jump(f){if(!g||g.over||f.air)return;f.vy=-470;f.air=true}
function basicAttack(a,b,fromPlayer){if(!g||g.over||a.hit>0)return;let dist=Math.abs(a.x-b.x);a.flash=.18;a.vx+=a.face*120;if(dist<120&&Math.abs(a.y-b.y)<90){let atk=fromPlayer?ROLES[sel].atk:BOSSES[bidx].atk;damage(b,atk*(.9+Math.random()*.2),a.face,fromPlayer?'basic':'boss')}}
function specialAttack(a,b,fromPlayer){if(!g||g.over||a.en<100)return;a.en=0;let type=fromPlayer?ROLES[sel].type:BOSSES[bidx].type;a.flash=.3;g.waves.push({x:a.x+a.face*35,y:a.y-72,dir:a.face,type,life:1.2,owner:fromPlayer?'p':'e',speed:type==='rock'?260:380})}
function damage(f,amount,dir,kind){f.hp-=amount;f.vx+=dir*(kind==='special'?250:120);f.hit=.22;g.shake=kind==='special'?10:4;for(let i=0;i<(kind==='special'?18:8);i++)g.parts.push({x:f.x,y:f.y-70,vx:(Math.random()-.5)*260,vy:(Math.random()-.8)*260,life:.45+Math.random()*.25,col:kind==='boss'?'#b889ff':'#ffd04a'});if(f.hp<=0)finish(f===g.e);updateHud()}
function ai(dt){let e=g.e,p=g.p;g.ai-=dt;if(g.ai>0||g.over)return;g.ai=.55+Math.random()*.35;let d=p.x-e.x,ad=Math.abs(d);e.face=d>0?1:-1;if(ad>170)e.vx+=Math.sign(d)*95;else if(Math.random()<.7)basicAttack(e,p,false);else{e.en=100;specialAttack(e,p,false)}}
function update(dt){if(!g||g.over)return;g.time-=dt;if(g.time<=0)return finish(g.p.hp/g.p.max>g.e.hp/g.e.max);let p=g.p,e=g.e;let dir=keys.r-keys.l;if(dir){p.face=dir;p.vx+=dir*760*dt};[p,e].forEach(f=>{f.vx*=Math.pow(.002,dt);f.vy+=980*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.hit=Math.max(0,f.hit-dt);f.flash=Math.max(0,f.flash-dt);if(f.y>=ground){f.y=ground;f.vy=0;f.air=false}f.x=Math.max(55,Math.min(W-55,f.x))});if(Math.abs(p.x-e.x)<95){let m=(p.x+e.x)/2;p.x=m-47;e.x=m+47};for(let q of g.waves){q.x+=q.dir*q.speed*dt;q.life-=dt;let target=q.owner==='p'?e:p;if(Math.abs(q.x-target.x)<70&&Math.abs(q.y-(target.y-65))<80&&!q.hit){q.hit=true;let atk=q.owner==='p'?ROLES[sel].atk*2.15:BOSSES[bidx].atk*1.7;damage(target,atk,q.dir,'special')}}g.waves=g.waves.filter(q=>q.life>0&&!q.hit);for(let p0 of g.parts){p0.x+=p0.vx*dt;p0.y+=p0.vy*dt;p0.vy+=440*dt;p0.life-=dt}g.parts=g.parts.filter(x=>x.life>0);g.shake=Math.max(0,g.shake-30*dt);g.p.en=Math.min(100,g.p.en+7*dt);g.e.en=Math.min(100,g.e.en+5*dt);ai(dt);updateHud()}
function arena(){let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#24408c');grd.addColorStop(.45,'#3f367f');grd.addColorStop(1,'#11142c');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(192,205,255,.9)';ctx.beginPath();ctx.arc(W*.5,H*.29,Math.min(W,H)*.11,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(116,116,220,.28)';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W*.5,H*.29,Math.min(W,H)*(.15+i*.05),0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#1a1b33';for(let i=0;i<9;i++){let x=i*W/8-20,h=45+(i%3)*30;ctx.fillRect(x,ground-h-18,42,h+18)}ctx.fillStyle='#26223f';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='rgba(120,102,185,.32)';for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(i*W/11,ground);ctx.lineTo(W/2+(i-5.5)*24,H);ctx.stroke()}}
function drawSprite(img,f,scale,flip){ctx.save();ctx.translate(f.x,f.y-65);ctx.scale((flip?-1:1)*scale,scale);let bob=f.air?-16:Math.sin(performance.now()/180)*2;ctx.translate(0,bob);if(f.hit>0)ctx.rotate(-.08*flip);if(f.flash>0)ctx.scale(1.08,.94);ctx.globalAlpha=f.hit>0&&Math.floor(f.hit*30)%2?0.55:1;ctx.drawImage(img,-65,-115,130,145);ctx.restore()}
function drawWave(q){ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.dir,1);let c=q.type==='fire'||q.type==='flame'?'#ff7b1d':q.type==='ice'?'#8fe8ff':q.type==='water'?'#48a9ff':q.type==='dark'?'#c57cff':q.type==='rock'?'#d99d67':'#bb68ff';ctx.shadowColor=c;ctx.shadowBlur=24;ctx.fillStyle=c;ctx.globalAlpha=Math.max(0,q.life);ctx.beginPath();if(q.type==='rock'){ctx.moveTo(-30,20);ctx.lineTo(-8,-28);ctx.lineTo(18,-10);ctx.lineTo(35,18);ctx.closePath()}else{ctx.moveTo(-50,0);ctx.quadraticCurveTo(-10,-42,46,0);ctx.quadraticCurveTo(-10,42,-50,0)}ctx.fill();ctx.restore()}
function draw(){if(!g)return;ctx.save();if(g.shake)ctx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);arena();ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(g.p.x,ground+6,48,10,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(g.e.x,ground+6,58,13,0,0,Math.PI*2);ctx.fill();drawSprite(imgs[sel],g.p,1,g.p.face<0);drawSprite(bimgs[bidx],g.e,1.25,g.e.face<0);for(let q of g.waves)drawWave(q);for(let p of g.parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,3+Math.random()*3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();if(g&&!g.over)raf=requestAnimationFrame(loop)}
function finish(win){if(g.over)return;g.over=true;setTimeout(()=>{show('result');$('rcard').classList.toggle('win',win);$('rtitle').textContent=win?'挑战成功！':'挑战失败';$('rdesc').textContent=win?'击败 BOSS！':'再试一次，或者换一个精灵。';$('reward').textContent=win?'⭐ +1   🪙 +500':''},500)}

function hold(btn,key,val){btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=val;btn.setPointerCapture?.(e.pointerId)});btn.addEventListener('pointerup',()=>keys[key]=0);btn.addEventListener('pointercancel',()=>keys[key]=0);btn.addEventListener('pointerleave',()=>keys[key]=0)}
hold($('left'),'l',1);hold($('right'),'r',1);
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump(g.p)});
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();basicAttack(g.p,g.e,true)});
$('special').addEventListener('pointerdown',e=>{e.preventDefault();if(g.p.en<100)g.p.en=100;specialAttack(g.p,g.e,true)});
</script>
</body></html>
