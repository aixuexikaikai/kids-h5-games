<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#7fc8ff" />
<title>玩具盲盒小游戏</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c2740;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit}
#stage{
  position:relative;height:100%;width:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 20%,#7ed9ff 0,#4268a8 60%,#1c2740 100%);
}
.game{
  position:relative;height:100%;max-height:100vh;aspect-ratio:2/3;max-width:100vw;overflow:hidden;
  background:#ffe4a8;border-radius:0;box-shadow:0 0 36px rgba(0,0,0,.28);
}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}
.tap-zone{
  position:absolute;left:20.5%;right:19.5%;top:74.1%;height:9.2%;border:0;background:transparent;cursor:pointer;
}
.tap-zone:active{transform:scale(.97)}
.box-glow{
  position:absolute;left:10%;top:38%;width:52%;height:34%;border-radius:30%;
  pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,245,115,.92) 0,rgba(255,208,64,.32) 42%,transparent 72%);
  filter:blur(4px);
}
.box-glow.go{animation:glow .95s ease-in-out 2}
@keyframes glow{0%,100%{opacity:0;transform:scale(.75)}45%{opacity:1;transform:scale(1.12)}}
.shaker{position:absolute;left:8%;top:39%;width:52%;height:31%;pointer-events:none;opacity:0;border-radius:30%}
.shaker.go{opacity:1;animation:shake .68s cubic-bezier(.36,.07,.19,.97) 2}
@keyframes shake{0%,100%{transform:translate(0) rotate(0)}20%{transform:translate(-8px,1px) rotate(-2deg)}40%{transform:translate(9px,-2px) rotate(2deg)}60%{transform:translate(-7px,2px) rotate(-1.5deg)}80%{transform:translate(6px,-1px) rotate(1.2deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .48s ease}
@keyframes flash{0%,100%{opacity:0}45%{opacity:.82}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.piece{position:absolute;top:-6%;width:10px;height:16px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(116vh) rotate(680deg)}}

.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,32,56,.58);backdrop-filter:blur(4px);padding:7%}
.modal.show{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  width:100%;max-width:430px;background:linear-gradient(#fffdf3,#fff3cd);border:5px solid #fff;border-radius:32px;
  box-shadow:0 18px 50px rgba(38,29,25,.32), inset 0 0 0 3px #f3a53c;
  padding:18px 18px 20px;text-align:center;transform:scale(.7);
  animation:pop .42s cubic-bezier(.2,.9,.2,1.35) forwards;
}
@keyframes pop{to{transform:scale(1)}}
.badge{display:inline-block;padding:8px 18px;background:#ffcd34;color:#7d3908;border-radius:999px;font-weight:900;font-size:clamp(20px,4.8vw,30px);box-shadow:inset 0 -4px rgba(199,111,16,.17)}
.result-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px;margin:14px 0 10px;border:4px solid #fff;box-shadow:0 9px 24px rgba(83,61,33,.18)}
.result-name{font-weight:900;color:#7d3908;font-size:clamp(26px,6vw,38px);margin:2px 0 14px}
.again{width:100%;border:0;border-radius:24px;padding:16px;background:linear-gradient(#ffe55f,#ffb62e);color:#6b3308;font-weight:900;font-size:clamp(22px,5.2vw,30px);box-shadow:0 7px 0 #d57c13;cursor:pointer}
.again:active{transform:translateY(4px);box-shadow:0 3px 0 #d57c13}
.close{margin-top:13px;border:0;background:transparent;color:#8e775e;font-weight:700;font-size:16px;padding:8px 18px}
.hint{position:absolute;left:50%;bottom:1.8%;transform:translateX(-50%);color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5);font-size:12px;opacity:.8;pointer-events:none}
@media (max-aspect-ratio:2/3){.game{width:100%;height:auto;max-height:none}}
</style>
</head>

const draw = document.getElementById('draw');
const modal = document.getElementById('modal');
const again = document.getElementById('again');
const closeBtn = document.getElementById('close');
const resultImg = document.getElementById('resultImg');
const resultName = document.getElementById('resultName');
const glow = document.getElementById('glow');
const shaker = document.getElementById('shaker');
const flash = document.getElementById('flash');
const confetti = document.getElementById('confetti');
let busy = false;

function burst(){
  confetti.innerHTML='';
  const colors=['#ffd93d','#ff6fae','#56d8ff','#7ee468','#936dff','#ff8b37'];
  for(let i=0;i<46;i++){
    const p=document.createElement('i');
    p.className='piece';
    p.style.left=(Math.random()*100)+'%';
    p.style.background=colors[(Math.random()*colors.length)|0];
    p.style.animationDelay=(Math.random()*.35)+'s';
    p.style.animationDuration=(1.25+Math.random()*.9)+'s';
    p.style.transform='rotate('+(Math.random()*360)+'deg)';
    confetti.appendChild(p);
  }
  setTimeout(()=>confetti.innerHTML='',2400);
}

function runAnim(){
  return new Promise(resolve=>{
    glow.classList.remove('go'); shaker.classList.remove('go'); flash.classList.remove('go');
    void glow.offsetWidth;
    glow.classList.add('go'); shaker.classList.add('go');
    setTimeout(()=>{ flash.classList.add('go'); burst(); },1080);
    setTimeout(resolve,1450);
  });
}

async function play(){
  if(busy) return;
  busy=true;
  modal.classList.remove('show');
  await runAnim();
  const toy=toys[Math.floor(Math.random()*toys.length)];
  resultImg.src=toy.src;
  resultName.textContent=toy.name;
  modal.classList.add('show');
  busy=false;
}

draw.addEventListener('click', play);
again.addEventListener('click', play);
closeBtn.addEventListener('click', ()=>modal.classList.remove('show'));
modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('show'); });
</script>
