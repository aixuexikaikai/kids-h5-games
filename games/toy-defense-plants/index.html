function resize(){
  const vv=window.visualViewport;
  const sw=Math.max(1,vv?vv.width:innerWidth);
  const sh=Math.max(1,vv?vv.height:innerHeight);
  rotate.style.display=sh>sw?'flex':'none';
  const aspect=sw/sh;
  VW=Math.max(BASEW,Math.round(VH*aspect));
  contentX=(VW-BASEW)/2;
  c.width=VW;
  c.height=VH;
}
addEventListener('resize',resize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
resize();

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function crop(img,s,x,y,w,h,r=14,alpha=1){
  if(!img.complete)return;
  ctx.save();ctx.globalAlpha=alpha;rr(x,y,w,h,r);ctx.clip();
  let sr=s.w/s.h,dr=w/h,sx=s.x,sy=s.y,sw=s.w,sh=s.h;
  if(sr>dr){sw=s.h*dr;sx=s.x+(s.w-sw)/2}else{sh=s.w/dr;sy=s.y+(s.h-sh)/2}
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore();
}
function hpbar(x,y,w,p,col='#55e56f'){
  ctx.fillStyle='rgba(20,20,20,.72)';rr(x,y,w,8,4);ctx.fill();
  ctx.fillStyle=col;rr(x,y,w*Math.max(0,p),8,4);ctx.fill();
}
function text(t,x,y,size=22,align='left',fill='#fff',weight=800){
  ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.fillStyle=fill;ctx.fillText(t,x,y);ctx.textAlign='left';
}
function laneY(r){return field.y+r*ch+ch/2}
function showBanner(t){banner=t;bannerT=1.2}

function reset(){
  defenders=[];enemies=[];bullets=[];fx=[];rush=[];selected='green';
  energy=250;baseHP=100;wave=1;score=0;ended=false;boss=false;spawnT=0;waveT=0;energyT=0;last=performance.now();
  banner='';bannerT=0;shake=0;paused=false;boss5Spawned=false;boss6Spawned=false;bossPhase=0;
}

function spawn(typeIndex=null,lane=null){
  let t=typeIndex===null?enemyTypes[Math.min(enemyTypes.length-1,Math.floor(Math.random()*(2+wave)))]:enemyTypes[typeIndex];
  enemies.push({type:t,lane:lane??Math.floor(Math.random()*5),x:1125,hp:t.hp,max:t.hp,speed:t.speed,attack:0,boss:false,slow:0});
}
function spawnBoss(stage=1){
  if(stage===1){
    enemies.push({type:{name:'机械霸王龙',src:Z.rex,hp:980,speed:8,r:58},lane:2,x:1120,hp:980,max:980,speed:8,attack:0,boss:true,bossStage:1,slow:0});
    bossPhase=1;showBanner('机械霸王龙 BOSS 出现！');
  }else{
    enemies.push({type:{name:'玩具机甲王',src:NEW_BOSS,img:newBossImg,hp:1650,speed:5.6,r:72},lane:2,x:1120,hp:1650,max:1650,speed:5.6,attack:0,boss:true,bossStage:2,slow:0,pulse:4.5});
    bossPhase=2;showBanner('最终 BOSS：玩具机甲王！');
  }
}

function place(row,col){
  const card=cards.find(x=>x.id===selected);
  if(card&&card.id==='shovel'){
    const idx=defenders.findIndex(d=>d.row===row&&d.col===col);
    if(idx>=0){
      const removed=cards.find(c=>c.id===defenders[idx].id);
      defenders.splice(idx,1);
      showBanner((removed?.name||'角色')+' 已铲除');
    }else showBanner('这里没有可以铲除的角色');
    return;
  }
  if(!card||energy<card.cost){showBanner('能量不足');return}
  if(card.id==='sword'){
    energy-=card.cost;
    enemies.forEach(e=>e.hp-=95);
    fx.push({kind:'slash',life:.45});
    shake=.22;showBanner('神剑斩！');
    return;
  }
  if(card.id==='bluecar'){
    energy-=card.cost;
    rush.push({lane:row,x:field.x+12,life:2.8,hit:new Set()});
    showBanner('蓝色战车冲锋！');
    return;
  }
  if(defenders.some(d=>d.row===row&&d.col===col)){showBanner('这个格子已经有角色了');return}
  energy-=card.cost;
  defenders.push({
    row,col,id:card.id,x:field.x+col*cw+cw/2,y:laneY(row),
    hp:card.hp,max:card.hp,fire:0,arm:card.armTime??0,armed:false,pulse:0
  });
}

function update(dt){
  if(!running||ended||paused)return;
  energyT+=dt;spawnT+=dt;waveT+=dt;
  if(bannerT>0)bannerT-=dt;if(shake>0)shake-=dt;
  if(energyT>2.15){energyT=0;energy=Math.min(999,energy+25)}
  if(wave<5&&spawnT>Math.max(1.75,3.05-wave*.24)){spawnT=0;spawn()}
  if(wave<5&&waveT>16){wave++;waveT=0;spawnT=0;showBanner('第 '+wave+' 波来了！')}
  if(wave===5&&!boss5Spawned){
    boss5Spawned=true;boss=true;spawnBoss(1);
    for(let i=0;i<4;i++)spawn(null,i%5);
  }
  if(wave===5&&boss5Spawned&&!enemies.some(e=>e.bossStage===1)&&enemies.length===0){
    wave=6;waveT=0;spawnT=0;boss=false;showBanner('最终第 6 波来了！');
  }
  if(wave===6&&!boss6Spawned){
    boss6Spawned=true;boss=true;spawnBoss(2);
    for(let i=0;i<5;i++)spawn(null,i%5);
  }

  defenders.forEach(d=>{
    d.fire-=dt;d.pulse+=dt;
    const card=cards.find(c=>c.id===d.id);

    // Cat mine: arms, then detonates when an enemy is close.
    if(d.id==='catmine'){
      if(!d.armed){
        d.arm-=dt;
        if(d.arm<=0){d.armed=true;showBanner('猫咪地雷准备好了')}
      }else{
        const trigger=enemies.find(e=>e.hp>0&&Math.abs(e.lane-d.row)<=1&&Math.hypot(e.x-d.x,(e.lane-d.row)*ch)<88);
        if(trigger){
          enemies.forEach(e=>{
            const dy=(e.lane-d.row)*ch;
            if(Math.hypot(e.x-d.x,dy)<125)e.hp-=card.dmg;
          });
          fx.push({kind:'blast',x:d.x,y:d.y,life:.48});
          d.hp=0;shake=.28;showBanner('砰！猫咪地雷爆炸');
        }
      }
      return;
    }

    // Triceratops: melee attack + knockback.
    if(d.id==='triceratops'&&d.fire<=0){
      const e=enemies.filter(e=>e.lane===d.row&&e.hp>0&&e.x>=d.x-12&&e.x-d.x<105).sort((a,b)=>a.x-b.x)[0];
      if(e){
        e.hp-=card.dmg;e.x+=30;e.slow=Math.max(e.slow,.35);d.fire=card.rate;
        fx.push({kind:'horn',x:e.x,y:laneY(e.lane),life:.22});shake=.06;
      }
      return;
    }

    // Ranged shooters.
    if(['green','purple','penguin','gray'].includes(d.id)&&d.fire<=0){
      const e=enemies.filter(e=>e.lane===d.row&&e.x>d.x-10&&e.hp>0).sort((a,b)=>a.x-b.x)[0];
      if(e){
        bullets.push({
          x:d.x+30,y:d.y,lane:d.row,v:d.id==='penguin'?255:(d.id==='gray'?225:290),
          dmg:card.dmg,kind:d.id,slow:card.slow||0,aoe:card.aoe||0
        });
        d.fire=card.rate;
      }
    }
  });

  bullets.forEach(b=>b.x+=b.v*dt);
  bullets.forEach(b=>{
    for(const e of enemies){
      if(e.lane===b.lane&&e.hp>0&&Math.abs(e.x-b.x)<(e.type.r||35)+10){
        if(b.aoe){
          enemies.forEach(t=>{
            const dy=(t.lane-e.lane)*ch;
            if(t.hp>0&&Math.hypot(t.x-e.x,dy)<=b.aoe)t.hp-=b.dmg;
          });
          fx.push({kind:'shell',x:e.x,y:laneY(e.lane),life:.32});
        }else{
          e.hp-=b.dmg;
          if(b.slow)e.slow=Math.max(e.slow,b.slow);
          fx.push({kind:b.kind==='penguin'?'ice':'hit',x:e.x,y:laneY(e.lane),life:.28});
        }
        b.x=1400;
        break;
      }
    }
  });
  bullets=bullets.filter(b=>b.x<1300);

  rush.forEach(r=>{
    r.x+=390*dt;r.life-=dt;
    enemies.forEach((e,idx)=>{
      if(e.lane===r.lane&&Math.abs(e.x-r.x)<55&&!r.hit.has(e)){
        r.hit.add(e);e.hp-=150;fx.push({kind:'hit',x:e.x,y:laneY(e.lane),life:.22});shake=.06;
      }
    });
  });
  rush=rush.filter(r=>r.life>0&&r.x<1180);

  enemies.forEach(e=>{
    if(e.hp<=0)return;
    if(e.slow>0)e.slow-=dt;
    if(e.bossStage===2){
      e.pulse-=dt;
      if(e.pulse<=0){
        e.pulse=4.8;
        defenders.forEach(d=>{ if(Math.abs(d.row-e.lane)<=1)d.hp-=16; });
        fx.push({kind:'bosswave',x:e.x,y:laneY(e.lane),life:.55});
        shake=.18;showBanner('玩具机甲王释放震荡波！');
      }
    }
    const speed=e.speed*(e.slow>0?.52:1);
    const r=e.type.r||35;

    // Mines intentionally do not hard-block before detonation; all other units can block.
    let block=defenders.find(d=>d.row===e.lane&&d.hp>0&&d.id!=='catmine'&&Math.abs(e.x-d.x)<r+38);
    if(block){
      e.attack-=dt;
      if(e.attack<=0){e.attack=.72;block.hp-=e.boss?34:18;fx.push({kind:'bite',x:block.x,y:block.y,life:.16})}
    }else e.x-=speed*dt;

    if(e.x<field.x-20){e.hp=0;baseHP-=e.boss?35:12;showBanner('蓝池基地受到攻击！');shake=.2}
  });

  defenders=defenders.filter(d=>d.hp>0);
  enemies=enemies.filter(e=>{
    if(e.hp<=0){score+=e.boss?1200:100;fx.push({kind:'poof',x:e.x,y:laneY(e.lane),life:.32});return false}
    return true;
  });
  fx.forEach(f=>f.life-=dt);fx=fx.filter(f=>f.life>0);

  if(baseHP<=0){ended=true;setTimeout(()=>finish(false),350)}
  if(boss6Spawned&&!enemies.some(e=>e.bossStage===2)&&wave===6&&enemies.length===0){ended=true;setTimeout(()=>finish(true),500)}
}

function drawBg(){
  let g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#64543d');g.addColorStop(.2,'#3c4e39');g.addColorStop(1,'#20372d');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#465970';rr(field.x-20,field.y-20,field.w+40,field.h+40,24);ctx.fill();

  for(let r=0;r<5;r++)for(let col=0;col<7;col++){
    ctx.fillStyle=(r+col)%2?'#71a34a':'#7cac51';
    ctx.fillRect(field.x+col*cw,field.y+r*ch,cw,ch);
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.strokeRect(field.x+col*cw+.5,field.y+r*ch+.5,cw-1,ch-1);
  }

  crop(plantImg,P.base,76,222,164,190,26,.98);
  text('蓝池基地',158,438,22,'center','#fff',1000);
  hpbar(93,451,130,baseHP/100,'#54e766');

  ctx.fillStyle='rgba(38,30,24,.9)';rr(18,15,196,58,20);ctx.fill();text('☀ '+energy,116,55,30,'center','#fff',1000);
  ctx.fillStyle='rgba(55,39,25,.91)';rr(470,15,340,58,18);ctx.fill();text(`第 ${wave}/6 波`,640,43,24,'center','#fff4cf',1000);
  let wp=wave<5?Math.min(1,waveT/16):(wave===5?0:0);
  const be=enemies.find(e=>e.boss);
  if((wave===5||wave===6)&&be)wp=Math.max(0,1-be.hp/be.max);
  if(wave===5&&!be&&boss5Spawned)wp=1;
  if(wave===6&&!be&&boss6Spawned)wp=1;
  ctx.fillStyle='rgba(0,0,0,.38)';rr(500,52,280,10,5);ctx.fill();
  ctx.fillStyle=(wave===5||wave===6)?'#ffb02e':'#6be36d';rr(500,52,280*wp,10,5);ctx.fill();

  ctx.fillStyle='rgba(28,35,39,.93)';rr(952,15,230,58,18);ctx.fill();text(`基地 ${Math.max(0,baseHP)}/100`,1067,52,20,'center','#fff',900);
  ctx.fillStyle='rgba(29,62,91,.96)';rr(1192,15,62,58,15);ctx.fill();
  text(paused?'▶':'Ⅱ',1223,54,28,'center','#fff',1000);

  // Dave guide portrait made from the uploaded child photo.
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=12;
  crop(daveImg,DAVE,18,500,190,153,18,.98);ctx.restore();
  ctx.fillStyle='rgba(65,43,24,.94)';rr(55,642,116,33,12);ctx.fill();
  text('戴夫',113,665,17,'center','#fff3c0',1000);
}

function drawCards(){
  // 9 cards in a compact 2-column tray so the full roster is usable on phone screens.
  ctx.fillStyle='rgba(18,27,34,.94)';rr(8,84,220,404,18);ctx.fill();
  const cardW=100,cardH=72,gx=8,gy=7;
  cards.forEach((card,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const x=14+col*(cardW+4),y=92+row*(cardH+gy);
    const on=selected===card.id;
    ctx.fillStyle=on?'#385641':'#24333d';rr(x,y,cardW,cardH,12);ctx.fill();
    ctx.strokeStyle=on?'#f2d95d':'rgba(255,255,255,.15)';ctx.lineWidth=on?3:1.5;rr(x,y,cardW,cardH,12);ctx.stroke();

    if(card.id==='shovel'){
      // Simple shovel icon, no external asset required.
      ctx.save();ctx.translate(x+28,y+28);ctx.rotate(-.55);
      ctx.strokeStyle='#d7dde2';ctx.lineWidth=7;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(0,17);ctx.stroke();
      ctx.fillStyle='#b9c2ca';ctx.beginPath();ctx.moveTo(-11,12);ctx.lineTo(11,12);ctx.lineTo(8,30);ctx.lineTo(-8,30);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#8f5b32';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(0,-29);ctx.stroke();
      ctx.restore();
      text(card.name,x+54,y+30,12,'left','#fff',900);
      text('点击植物',x+54,y+50,9,'left','#d7e7ee',800);
    }else{
      crop(card.img||plantImg,card.src,x+5,y+6,45,45,10,energy>=card.cost?1:.4);
      text(card.name,x+54,y+24,11,'left',energy>=card.cost?'#fff':'#727b83',900);
      text('☀'+card.cost,x+55,y+48,13,'left',energy>=card.cost?'#ffe15a':'#666',1000);
    }

    if(['penguin','triceratops','catmine'].includes(card.id)){
      ctx.fillStyle='#ff564c';rr(x+74,y+4,21,16,7);ctx.fill();text('新',x+84.5,y+16,9,'center','#fff',1000);
    }
  });
}

function drawDef(d){
  const card=cards.find(c=>c.id===d.id);
  const img=card.img||plantImg;
  let s=(d.id==='triceratops'?86:d.id==='catmine'?70:76);

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=7;
  crop(img,card.src,d.x-s/2,d.y-s/2-4,s,s,18);
  ctx.restore();

  if(d.id==='catmine'){
    // Arming indicator and pulsing ring once ready.
    if(!d.armed){
      let p=1-Math.max(0,d.arm)/(card.armTime||2.5);
      ctx.strokeStyle='rgba(255,225,90,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(d.x,d.y,42,-Math.PI/2,-Math.PI/2+Math.PI*2*p);ctx.stroke();
      text(Math.ceil(Math.max(0,d.arm)),d.x,d.y+5,16,'center','#fff',1000);
    }else{
      const pulse=4+Math.sin(d.pulse*8)*3;
      ctx.strokeStyle='rgba(255,109,54,.85)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(d.x,d.y,42+pulse,0,Math.PI*2);ctx.stroke();
    }
  }

  if(d.id==='penguin'&&d.fire>.58){
    ctx.fillStyle='rgba(146,232,255,.25)';ctx.beginPath();ctx.arc(d.x+28,d.y-8,10,0,Math.PI*2);ctx.fill();
  }

  hpbar(d.x-34,d.y+42,68,d.hp/d.max,d.id==='catmine'?'#ffd45c':'#55e56f');
}

function drawEnemy(e){
  const y=laneY(e.lane),s=e.bossStage===2?150:(e.boss?110:76);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.42)';ctx.shadowBlur=16;ctx.shadowOffsetY=8;
  if(e.type.img===newBossImg){
    crop(newBossImg,e.type.src,e.x-s*.58,y-s*.62,s*1.16,s*1.18,18);
  }else crop(zombieImg,e.type.src,e.x-s/2,y-s/2,s,s,20);
  ctx.restore();

  if(e.slow>0){
    ctx.strokeStyle='rgba(135,232,255,.85)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,y,s*.45,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='rgba(255,45,45,.96)';ctx.shadowColor='#ff3232';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(e.x-12,y-10,e.boss?5:4,0,Math.PI*2);ctx.arc(e.x+10,y-10,e.boss?5:4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  hpbar(e.x-s/2,y-s/2-12,s,e.hp/e.max,e.boss?'#ffb12d':'#e85a5a');
}

function drawBullets(){
  bullets.forEach(b=>{
    ctx.save();
    if(b.kind==='penguin'){
      ctx.shadowBlur=18;ctx.shadowColor='#8eeaff';ctx.fillStyle='#b8f5ff';
      ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      for(let a=0;a<3;a++){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a*Math.PI/3);ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();ctx.restore()}
    }else{
      ctx.shadowBlur=18;ctx.shadowColor=b.kind==='purple'?'#cd75ff':(b.kind==='gray'?'#ffad42':'#b5ff45');
      ctx.fillStyle=b.kind==='purple'?'#cf76ff':(b.kind==='gray'?'#ffbd56':'#c2ff52');
      ctx.beginPath();ctx.arc(b.x,b.y,b.kind==='gray'?11:9,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });

  rush.forEach(r=>crop(plantImg,P.bluecar,r.x-48,laneY(r.lane)-34,96,68,16));

  fx.forEach(f=>{
    if(f.kind==='slash'){
      ctx.save();ctx.globalAlpha=f.life/.45;ctx.strokeStyle='#8deaff';ctx.shadowColor='#4bcfff';ctx.shadowBlur=25;ctx.lineWidth=18;
      ctx.beginPath();ctx.moveTo(260,590);ctx.lineTo(1060,160);ctx.stroke();ctx.restore();
    }else if(f.kind==='blast'){
      ctx.save();ctx.globalAlpha=Math.min(1,f.life/.2);
      const r=(.48-f.life)*260+28;
      const grad=ctx.createRadialGradient(f.x,f.y,8,f.x,f.y,r);
      grad.addColorStop(0,'rgba(255,255,215,.95)');grad.addColorStop(.35,'rgba(255,190,61,.9)');grad.addColorStop(1,'rgba(255,74,28,0)');
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(f.x,f.y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    }else if(f.kind==='bosswave'){
      ctx.save();ctx.globalAlpha=Math.min(1,f.life/.3);
      ctx.strokeStyle='rgba(255,78,54,.9)';ctx.shadowColor='#ff4b37';ctx.shadowBlur=18;ctx.lineWidth=8;
      const br=(.55-f.life)*330+35;
      ctx.beginPath();ctx.arc(f.x,f.y,br,0,Math.PI*2);ctx.stroke();ctx.restore();
    }else if(f.kind==='shell'){
      ctx.save();ctx.globalAlpha=Math.min(1,f.life/.18);
      const sr=(.32-f.life)*180+16;
      const sg=ctx.createRadialGradient(f.x,f.y,4,f.x,f.y,sr);
      sg.addColorStop(0,'rgba(255,248,205,.95)');sg.addColorStop(.45,'rgba(255,173,56,.85)');sg.addColorStop(1,'rgba(255,91,30,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(f.x,f.y,sr,0,Math.PI*2);ctx.fill();ctx.restore();
    }else if(f.kind==='ice'){
      ctx.save();ctx.globalAlpha=f.life/.28;ctx.strokeStyle='#c8f8ff';ctx.lineWidth=3;
      for(let i=0;i<6;i++){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(i*Math.PI/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(24,0);ctx.stroke();ctx.restore()}ctx.restore();
    }else if(f.kind==='horn'){
      ctx.save();ctx.globalAlpha=f.life/.22;ctx.strokeStyle='#ffd45d';ctx.lineWidth=6;ctx.beginPath();ctx.arc(f.x,f.y,26,Math.PI*.8,Math.PI*1.25);ctx.stroke();ctx.restore();
    }else if(f.kind==='poof'){
      ctx.save();ctx.globalAlpha=f.life/.32;ctx.fillStyle='rgba(255,239,181,.7)';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(f.x+Math.cos(i*1.26)*18,f.y+Math.sin(i*1.26)*14,8,0,Math.PI*2);ctx.fill()}ctx.restore();
    }else{
      ctx.fillStyle='rgba(255,245,118,.85)';ctx.beginPath();ctx.arc(f.x,f.y,18*Math.max(.25,f.life/.25),0,Math.PI*2);ctx.fill();
    }
  });
}

function draw(){
  // 先清理并铺满整个真实横屏视口，宽屏手机不会出现黑边。
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,VW,VH);
  const fullBg=ctx.createLinearGradient(0,0,0,VH);
  fullBg.addColorStop(0,'#64543d');fullBg.addColorStop(.2,'#3c4e39');fullBg.addColorStop(1,'#20372d');
  ctx.fillStyle=fullBg;ctx.fillRect(0,0,VW,VH);

  // 原 1280×720 核心玩法区居中显示，保持人物、格子和 UI 不变形。
  ctx.save();
  ctx.translate(contentX,0);
  if(shake>0)ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*7);
  drawBg();defenders.forEach(drawDef);enemies.forEach(drawEnemy);drawBullets();drawCards();

  ctx.fillStyle='rgba(24,28,30,.82)';rr(850,632,402,58,16);ctx.fill();
  const card=cards.find(c=>c.id===selected);
  let hint='已选择：'+card.name;
  if(card.id==='catmine')hint+=' · 埋下后等待 2.5 秒';
  if(card.id==='triceratops')hint+=' · 近战顶退僵尸';
  if(card.id==='penguin')hint+=' · 冰弹减速';
  if(card.id==='shovel')hint='已选择：铲子 · 点击已种角色将其铲除';
  text(hint,1051,668,17,'center','#fff',900);

  if(paused){
    ctx.fillStyle='rgba(9,14,18,.52)';ctx.fillRect(-contentX,0,VW,VH);
    ctx.fillStyle='rgba(20,30,38,.92)';rr(510,292,260,112,24);ctx.fill();
    text('游戏暂停',640,340,30,'center','#fff4c8',1000);
    text('点击右上角继续',640,374,15,'center','#d8e8ef',800);
  }

  if(bannerT>0){
    ctx.save();ctx.globalAlpha=Math.min(1,bannerT*2);
    ctx.fillStyle='rgba(20,27,31,.88)';rr(470,82,340,46,20);ctx.fill();
    text(banner,640,113,18,'center','#fff2b7',1000);ctx.restore();
  }
  ctx.restore();
}

function loop(t){const dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function pos(ev){const r=c.getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;return{x:(p.clientX-r.left)*VW/r.width,y:(p.clientY-r.top)*VH/r.height}}
function click(x,y){
  if(ended)return;
  // 宽屏手机多出的区域只作为延展背景；交互坐标映射回核心游戏区。
  x-=contentX;
  if(x>=1192&&x<=1254&&y>=15&&y<=73){
    paused=!paused;
    showBanner(paused?'已暂停':'继续战斗');
    return;
  }

  // 2-column card tray.
  if(x>=14&&x<=218&&y>=92&&y<=92+5*79){
    const col=Math.floor((x-14)/104),row=Math.floor((y-92)/79),i=row*2+col;
    if(i>=0&&i<cards.length){selected=cards[i].id;return}
  }

  if(x>=field.x&&x<=field.x+field.w&&y>=field.y&&y<=field.y+field.h){
    const col=Math.max(0,Math.min(field.cols-1,Math.floor((x-field.x)/cw)));
    const row=Math.max(0,Math.min(field.rows-1,Math.floor((y-field.y)/ch)));
    place(row,col);
  }
}
c.addEventListener('touchstart',e=>{e.preventDefault();const p=pos(e);click(p.x,p.y)},{passive:false});
c.addEventListener('mousedown',e=>{const p=pos(e);click(p.x,p.y)});

function finish(win){
  start.style.display='flex';
  start.innerHTML=`<div class="panel">
    <div class="title">${win?'蓝池守住了！':'蓝池被突破'}</div>
    <div class="sub">得分 ${score} · 到达第 ${wave} 波</div>
    <div class="rules">${win
      ?'机械霸王龙和最终玩具机甲王都已经被击败。你成功守住了蓝池基地。'
      :'建议先建立远程火力；布局不合适时可用铲子清理位置，再用三角龙和猫咪地雷应对高压路线。'}</div>
    <button id="again">再玩一局</button>
  </div>`;
  document.getElementById('again').onclick=()=>{start.style.display='none';reset();running=true}
}
document.getElementById('go').onclick=()=>{start.style.display='none';reset();running=true};
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop)});
})();
</script>
