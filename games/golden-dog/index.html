function coord(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function inside(p,x,y,r){return Math.hypot(p.x-x,p.y-y)<r}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=coord(e);cv.setPointerCapture(e.pointerId);if(mode==='title'||mode==='win'||mode==='lose'){if(p.x>440&&p.x<840&&p.y>490&&p.y<600)start();return}if(mode==='pause'){if(p.x>470&&p.x<810&&p.y>340&&p.y<460)mode='playing';return}if(inside(p,1207,52,38)){mode='pause';return}if(inside(p,1123,52,38)){mute=!mute;return}if(inside(p,1136,584,85)){dash();return}if(inside(p,988,592,68)){bark();return}if(p.x<310&&p.y>455){pad.id=e.pointerId;setPad(p);pointerTarget=null;return}if(p.y>340){pointerTarget={x:clamp(p.x,155,1155),y:clamp(p.y,460,650)}}});
function setPad(p){let x=p.x-pad.x,y=p.y-pad.y,m=Math.hypot(x,y),v=Math.min(1,m/75);pad.dx=m?x/m*v:0;pad.dy=m?y/m*v:0}
cv.addEventListener('pointermove',e=>{if(e.pointerId===pad.id)setPad(coord(e))});function up(e){if(e.pointerId===pad.id){pad.id=null;pad.dx=0;pad.dy=0}}cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keyboard[e.key]=true;if((e.key==='Enter')&&['title','win','lose'].includes(mode))start();else if(e.key==='Escape'&&mode==='playing')mode='pause';else if(e.key==='Escape'&&mode==='pause')mode='playing';else if(e.key===' '&&!e.repeat)dash();else if((e.key==='j'||e.key==='J')&&!e.repeat)bark()});addEventListener('keyup',e=>keyboard[e.key]=false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')mode='pause'});
function frame(now){const dt=(now-last)/1000;last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
